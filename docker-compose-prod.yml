# Finami — ambiente de PRODUÇÃO
#
# Subido pela pipeline .github/workflows/deploy-prod.yml no servidor:
#   docker compose --env-file .env.prod -f docker-compose-prod.yml up --build -d
#
# Caddy termina o TLS (certificado Let's Encrypt automático para ${DOMAIN}) e encaminha:
#   /api/*  → api:8080
#   resto   → web:80   (SPA; mesma origem, então VITE_API_URL fica vazio)
# Banco, API e frontend NÃO expõem portas no host. ASPNETCORE_ENVIRONMENT=Production.

services:
  db:
    image: postgres:17-alpine
    container_name: finami-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - finami_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - finami-internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: finami-api:prod
    container_name: finami-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FinamiContext: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Cors__AllowedOrigins__0: https://${DOMAIN}
      # MCP/OAuth (feature 004): API e frontend no mesmo domínio atrás do Caddy.
      Mcp__PublicUrl: ${MCP_PUBLIC_URL:-https://${DOMAIN}}
      App__PublicUrl: ${APP_PUBLIC_URL:-https://${DOMAIN}}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finami-internal

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SITE_BASENAME: ""
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: finami-web:prod
    container_name: finami-web
    restart: unless-stopped
    networks:
      - finami-internal

  caddy:
    image: caddy:2-alpine
    container_name: finami-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - finami_caddy_data:/data
      - finami_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - finami-internal
      - finami-external

volumes:
  finami_pgdata:
  finami_caddy_data:
  finami_caddy_config:

networks:
  finami-internal:
    driver: bridge
  finami-external:
    external: true

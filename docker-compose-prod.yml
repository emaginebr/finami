# Finami — ambiente de PRODUÇÃO
#
# Subido pela pipeline .github/workflows/deploy-prod.yml no servidor:
#   docker compose --env-file .env.prod -f docker-compose-prod.yml up --build -d
#
# Só a API sobe aqui. O frontend (SPA) é publicado pelo deploy de outro projeto, cujo proxy
# HTTPS deve encaminhar /api/*, /mcp*, /oauth/* e /.well-known/oauth-* para esta API:
#   - proxy no host:        http://127.0.0.1:80
#   - proxy em container:   http://finami-api:8080 pela rede externa `emagine-network`
# repassando X-Forwarded-Proto/For e sem buffer em /mcp (text/event-stream).
# O PostgreSQL é EXTERNO: a connection string vem do secret FINAMI_CONNECTION_STRING.
# ASPNETCORE_ENVIRONMENT=Production.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: finami-api:prod
    container_name: finami-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FinamiContext: ${FINAMI_CONNECTION_STRING:?defina o secret FINAMI_CONNECTION_STRING}
      Jwt__Secret: ${FINAMI_JWT_SECRET:?defina FINAMI_JWT_SECRET}
      Google__ClientId: ${FINAMI_GOOGLE_CLIENT_ID:-}
      Cors__AllowedOrigins__0: https://${FINAMI_DOMAIN}
      # MCP/OAuth (feature 004): API e frontend no mesmo domínio público (proxy do outro projeto).
      Mcp__PublicUrl: https://${FINAMI_DOMAIN}
      App__PublicUrl: https://${FINAMI_DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "80:8080"
    networks:
      - emagine-network

networks:
  # Rede compartilhada entre os projetos do servidor (o deploy cria se não existir)
  emagine-network:
    external: true

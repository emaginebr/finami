# Finami — frontend (SPA). Copiado para /etc/nginx/conf.d/default.conf.
# Serve a SPA e encaminha /api, /mcp, /oauth e /.well-known/oauth-* para a API (`finami-api`),
# mantendo app e API na mesma origem. O HTTPS fica no proxy do servidor, na frente deste container.
# Se VITE_SITE_BASENAME for usado (ex.: /finami), este arquivo precisa de ajuste: ver README.

# Esquema original: o do proxy HTTPS do servidor (X-Forwarded-Proto) ou o desta conexão
map $http_x_forwarded_proto $finami_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # O mime.types do nginx 1.27 não mapeia .webmanifest; o tipo é definido só no location do
    # manifest (um bloco `types` no server substituiria todo o mapa herdado).

    # Cabeçalhos de segurança. Atenção: add_header dentro de um location substitui os do
    # server, por isso eles são repetidos nos locations que definem Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # DNS interno do Docker; resolve `finami-api` na hora da requisição (o nginx sobe mesmo se a API
    # ainda não existir, e acompanha a troca de IP quando o container da API é recriado)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Healthcheck do container / compose
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Arquivos com hash no nome (gerados pelo Vite): cache de 1 ano
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Entrada da SPA e manifest: sempre revalidar (novas versões aparecem sem limpar cache)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Service worker (feature 005): o navegador precisa sempre revalidar para achar versões
    # novas. 404 de verdade se o arquivo faltar (nunca cair no index.html).
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /registerSW.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ~ ^/workbox-.*\.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # --- API na mesma origem --------------------------------------------------------------
    # proxy_pass com variável repassa a URI original sem alteração.
    location /api/ {
        set $finami_api http://finami-api:8080;
        proxy_pass $finami_api;
        include /etc/nginx/conf.d/finami-proxy.inc;
    }

    # MCP (Streamable HTTP): respostas text/event-stream saem sem buffer
    location /mcp {
        set $finami_api http://finami-api:8080;
        proxy_pass $finami_api;
        include /etc/nginx/conf.d/finami-proxy.inc;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /oauth/ {
        set $finami_api http://finami-api:8080;
        proxy_pass $finami_api;
        include /etc/nginx/conf.d/finami-proxy.inc;
    }

    location /.well-known/oauth- {
        set $finami_api http://finami-api:8080;
        proxy_pass $finami_api;
        include /etc/nginx/conf.d/finami-proxy.inc;
    }

    # Rotas da SPA (/carteiras/12, /familias/3…) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

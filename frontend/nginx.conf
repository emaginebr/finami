# Finami — frontend (SPA). Copiado para /etc/nginx/conf.d/default.conf.
# TLS e o encaminhamento de /api/* ficam no Caddy (prod); aqui só o conteúdo estático.
# Se VITE_SITE_BASENAME for usado (ex.: /finami), este arquivo precisa de ajuste: ver README.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # O mime.types do nginx 1.27 já mapeia .webmanifest para application/manifest+json.
    # (Não declarar um bloco `types` aqui: ele substituiria todo o mapa herdado.)

    # Cabeçalhos de segurança. Atenção: add_header dentro de um location substitui os do
    # server, por isso eles são repetidos nos locations que definem Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Healthcheck do container / compose
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Arquivos com hash no nome (gerados pelo Vite): cache de 1 ano
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Entrada da SPA e manifest: sempre revalidar (novas versões aparecem sem limpar cache)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Rotas da SPA (/carteiras/12, /familias/3…) caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

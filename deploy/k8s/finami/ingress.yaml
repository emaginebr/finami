# Roteamento público de finami.site (contracts/routing.md). Os caminhos chegam à API com o
# prefixo original (sem rewrite). www.finami.site NÃO passa por aqui: a Cloudflare já redireciona
# (301) www → finami.site na borda, e o www não é Public Hostname do túnel.
# O /mcp fica em ingress-mcp.yaml, porque as anotações de buffer/timeout valem por objeto.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finami
  annotations:
    # Sem TLS no ingress: o HTTPS termina na Cloudflare e o túnel chega aqui por HTTP.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: finami.site
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: finami-api
                port:
                  number: 8080
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: finami-api
                port:
                  number: 8080
          # Metadados OAuth/MCP (OAuthController). `Prefix` casa por segmento, então cada documento
          # é listado; o segundo cobre também /.well-known/oauth-protected-resource/mcp.
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: finami-api
                port:
                  number: 8080
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: finami-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finami-web
                port:
                  number: 80

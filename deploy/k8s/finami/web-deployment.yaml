# Frontend do Finami (SPA servida por nginx). As variáveis VITE_* são embutidas no build da imagem,
# por isso não há env aqui. No cluster as rotas da API chegam direto do ingress à API; as
# `location /api` etc. do nginx.conf só são usadas no docker-compose.yml local.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finami-web
  labels:
    app: finami-web
spec:
  replicas: 1
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: finami-web
  template:
    metadata:
      labels:
        app: finami-web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          # Tag definida pela pipeline (kustomization.yaml → images)
          image: ghcr.io/emaginebr/finami-web
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
